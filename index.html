/* Keep the estimate close to carton inputs without using model space. */
.workspace aside{display:grid;min-width:0;gap:14px}
.workspace aside>.crate-panel{margin:0;padding:15px}
.workspace aside .crate-grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.workspace aside .crate-grid .crate-dims{grid-column:1/-1}
.workspace aside .crate-actions{margin-top:12px}

.tabs .plan-tab{display:grid;gap:4px;text-align:left;white-space:normal;min-width:0}
.plan-tab>span,.plan-tab>small{font-size:11px}
.plan-lowest{display:inline-block;color:#245f43;background:#e5f0e8;border-radius:5px;padding:2px 5px;font-size:10px}
.plan-tab>small,.stale-result{color:#825821}
.stale-result{background:#fff0d7;border-radius:5px;padding:4px 7px;margin-left:8px;font-size:11px}
.stale-metrics{opacity:.7}

.carton-list-actions{display:flex;align-items:center;justify-content:flex-end;flex-wrap:wrap;gap:7px}.carton-list-actions button{white-space:nowrap}

.carton-presets{display:flex;flex-wrap:wrap;gap:6px;margin:0 0 12px}
.carton-presets [aria-pressed=true]{background:#e5f0e8;color:#245f43;border-color:#8cb49a}
#tabs.tabs{display:block;min-width:0}
#tabs:empty{display:none}
.plan-options{display:grid;grid-template-columns:repeat(var(--plan-count),minmax(0,1fr));gap:6px}
.tabs .plan-tab{display:block;width:100%;min-height:36px;text-align:center;padding:6px 4px}
.plan-tab strong{display:flex;flex-wrap:wrap;align-items:center;justify-content:center;gap:3px 5px;line-height:1.35}
.plan-details{display:flex;flex-wrap:wrap;gap:5px 12px;border:1px solid var(--line);border-radius:7px;margin-top:6px;padding:8px 10px;font-size:12px}
.plan-details small{color:#825821}
.crate-header{display:flex;justify-content:space-between;align-items:flex-start;gap:8px;flex-wrap:wrap;margin-bottom:10px}
.crate-header .crate-title{flex:0 0 auto;margin:0;display:grid;gap:4px}
.crate-header .stale-result{margin-left:0}
.workspace aside .crate-header .crate-actions{margin:0 0 0 auto;gap:5px}
.crate-header .crate-actions button{white-space:nowrap;padding:8px 9px;font-size:12px}
.crate-header .crate-actions .crate-copy{font-size:13px;font-weight:650;padding:9px 12px;color:#235d46;background:#d9ebde;border:1px solid #b3d1ba;border-radius:7px}
.presence-count{font-size:11px;color:#456e58;white-space:nowrap;align-self:center}
.presence-count:before{content:'';display:inline-block;width:6px;height:6px;background:#548365;border-radius:50%;margin-right:4px}
.local-project-toolbar{display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin:8px 0}
.local-project-toolbar p{margin:0;flex:1 0 100%;overflow-wrap:anywhere}

.release-controls,.release-pages{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.release-controls{margin:12px 0 6px;scroll-margin-top:90px}
.release-controls label,.release-pages span{color:var(--muted);font-size:13px}
.release-controls select{width:auto;margin:0;scroll-margin-top:90px}
.release-pages{justify-content:center;margin-top:16px;padding-top:12px;border-top:1px solid var(--line)}
