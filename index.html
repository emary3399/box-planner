$('cratePanel').onclick=e=>{let b=e.target.closest('[data-copy],[data-use-shipping]');if(!b||dirty)return;let c=selectedCrate();if(!c)return;if(b.hasAttribute('data-use-shipping')){if(c.gross===null){toast('请先填齐纸箱实重。');return;}if(!shippingReady||!shippingApp()){toast('运费页面正在载入，请稍后再试。');return;}const woodPricing=packingWoodPricing(c);shippingApp().applyCrate({name:$('clientName').value,address:$('clientAddress').value,dims:c.dims,gross:c.gross,qty:1,woodPricing});packingWoodUnitDraft=null;shippingState=captureShipping();shippingSource={choice,bounds:current().bounds,dims:c.dims};$('shippingSource').textContent=`已带入方案 ${choice+1} · ${dims(c.dims)} cm · 实重估算 ${c.grossKg} kg · 1只木箱${woodPricing.cost===null?' · 木箱报价待填单价':' · 木箱报价 $'+woodPricing.usd.toFixed(2)}`;persist();setWorkspacePage('shipping');toast(woodPricing.cost===null?'已带入木箱尺寸和重量，可填写木箱单价。':'已带入当前木箱方案和报价。');return;}
if(b.dataset.copy==='all')copyValue(`${$('clientName').value?$('clientName').value+'\n':''}木箱外尺寸：${dims(c.dims)} cm\n含木箱总实重估算：${c.grossKg===null?'待补重量':c.grossKg+' kg'}\n木箱体积重：${c.volumetricKg} kg\n体积：${c.volume.toFixed(3)} m³`);};
function applyImportedProject(a){$('clientAddress').value=typeof a.address==='string'?a.address:'';restoreShipping(a.shipping||null);if(a.result?.solutions?.[a.choice??0]){result=a.result;choice=a.choice??0;dirty=false;selected=null;setView('iso');renderResults();}persist();}

const appHeader=document.querySelector('body > header');

if(appHeader){new ResizeObserver(syncToolbarOffset).observe(appHeader);syncToolbarOffset();}
