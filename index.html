<dialog id="modelDialog" aria-label="展开模型"></dialog><dialog id="pasteDialog"><h2>粘贴识别尺寸</h2><textarea id="pasteText" rows="7" placeholder="壁挂箱 134.5×16.5×83.5 cm，数量3，实重25kg&#10;底座箱 107.8×52.3×50.6 cm，3箱&#10;也可直接粘贴 Excel 表格"></textarea><div class="paste-toolbar"><button id="recognizePaste" class="ghost">识别并预览</button><small>无单位按 cm；尺寸按长、宽、高顺序。</small></div><p id="pasteError" role="alert"></p><div id="pastePreview" aria-live="polite"></div><small>确认导入会替换当前纸箱清单。</small><div class="dialog-actions"><button id="cancelPaste" class="ghost">取消</button><button id="confirmPaste" class="primary" disabled>确认导入</button></div></dialog><input id="fileInput" type="file" accept="application/json,.json" hidden><div id="toast" role="status"></div><dialog id="cloudDialog"><div class="section-head"><div><h2>云端客户项目</h2></div><button id="closeCloud" class="small-btn">关闭</button></div><input id="cloudSearch" type="text" placeholder="按客户名称或备注搜索"><div id="cloudList"></div><div id="cloudPagination" class="cloud-pagination"></div></dialog><dialog id="versionDialog"><div class="section-head"><h2>版本更新记录</h2><button id="closeVersion" class="small-btn">关闭</button></div><div id="versionList"></div><a class="history-link" id="mirrorUpdates" href="#" target="_blank" rel="noopener">查看完整更新记录 ↗</a></dialog><script>/* True per-pixel depth testing, with a software fallback. */
(function(root){
function depthAt(poly,p){for(let k=1;k<poly.length-1;k++){let a=poly[0],b=poly[k],c=poly[k+1],det=(b[1]-c[1])*(a[0]-c[0])+(c[0]-b[0])*(a[1]-c[1]);if(Math.abs(det)<1e-10)continue;let u=((b[1]-c[1])*(p[0]-c[0])+(c[0]-b[0])*(p[1]-c[1]))/det,v=((c[1]-a[1])*(p[0]-c[0])+(a[0]-c[0])*(p[1]-c[1]))/det;if(u>=-1e-7&&v>=-1e-7&&u+v<=1+1e-7)return u*a[2]+v*b[2]+(1-u-v)*c[2];}return null;}
function pick(faces,p){let closest=null,z=-Infinity;for(let f of faces){let q=depthAt(f.poly,p);if(q!==null&&q>=z){z=q;closest=f;}}return closest;}
let canvas,gl,program,buffer,software;
function init(){canvas=document.createElement('canvas');try{gl=canvas.getContext('webgl',{alpha:true,antialias:true,preserveDrawingBuffer:true});if(!gl)return;const shader=(type,src)=>{let s=gl.createShader(type);gl.shaderSource(s,src);gl.compileShader(s);if(!gl.getShaderParameter(s,gl.COMPILE_STATUS))throw Error('Shader failed');return s;};program=gl.createProgram();gl.attachShader(program,shader(gl.VERTEX_SHADER,'attribute vec3 p; attribute vec3 c; varying vec3 v; void main(){gl_Position=vec4(p,1.);v=c;}'));gl.attachShader(program,shader(gl.FRAGMENT_SHADER,'precision mediump float; varying vec3 v; void main(){gl_FragColor=vec4(v,1.);}'));gl.linkProgram(program);if(!gl.getProgramParameter(program,gl.LINK_STATUS))throw Error('Link failed');buffer=gl.createBuffer();}catch{gl=null;}}

$('cratePanel').onclick=e=>{let b=e.target.closest('[data-copy],[data-use-shipping]');if(!b||dirty)return;let c=selectedCrate();if(!c)return;if(b.hasAttribute('data-use-shipping')){if(c.gross===null){toast('请先填齐纸箱实重。');return;}if(!shippingReady||!shippingApp()){toast('运费页面正在载入，请稍后再试。');return;}shippingApp().applyCrate({name:$('clientName').value,address:$('clientAddress').value,dims:c.dims,gross:c.gross,qty:1,woodCost:Freight.woodCost(c.area)});shippingState=captureShipping();shippingSource={choice,bounds:current().bounds,dims:c.dims};$('shippingSource').textContent=`已带入方案 ${choice+1} · ${dims(c.dims)} cm · 实重估算 ${c.grossKg} kg · 1只木箱`;persist();setWorkspacePage('shipping');toast('已带入木箱数据并算出木箱报价。');return;}
if(b.dataset.copy==='all')copyValue(`${$('clientName').value?$('clientName').value+'\n':''}木箱外尺寸：${dims(c.dims)} cm\n含木箱总实重估算：${c.grossKg===null?'待补重量':c.grossKg+' kg'}\n木箱体积重：${c.volumetricKg} kg\n体积：${c.volume.toFixed(3)} m³`);};
function applyImportedProject(a){$('clientAddress').value=typeof a.address==='string'?a.address:'';restoreShipping(a.shipping||null);if(a.result?.solutions?.[a.choice??0]){result=a.result;choice=a.choice??0;dirty=false;selected=null;setView('iso');renderResults();}persist();}
document.querySelectorAll('[data-app-version]').forEach(el=>el.textContent='v'+AppReleases.version);
$('versionList').innerHTML=AppReleases.history.slice(0,5).map(r=>`<article class="release compact-release"><div><strong>v${r.version}</strong><time>${r.date}</time></div><p>${esc(r.summary||r.items[0])}</p></article>`).join('');$('versionBtn').onclick=()=>$('versionDialog').showModal();$('closeVersion').onclick=()=>$('versionDialog').close();



window.addEventListener('resize',()=>shippingApp()?.viewport?.(window.innerHeight));

// Match the calculation bar's sticky offset to the wrapping site header.
const appHeader=document.querySelector('body > header');
function syncToolbarOffset(){if(!appHeader)return;const sticky=window.getComputedStyle(appHeader).position==='sticky',height=sticky?Math.ceil(appHeader.getBoundingClientRect().height):0;document.documentElement.style.setProperty('--app-header-height',height+'px');}
if(appHeader){new ResizeObserver(syncToolbarOffset).observe(appHeader);syncToolbarOffset();}
